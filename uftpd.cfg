# FTP CONFIGURATION SAMPLE "/etc/uftpd.cfg"

#######################################################
#                 UFTP SERVER SETTINGS                #
#######################################################

# NOTES: 
# restart uFTP to apply the configuration after changing parameters

# Maximum allowed FTP connections on the server.
# The memory for every slot (about 37 KB) is reserved when the server starts: 50 slots are about 2 MB,
# 1,000 about 37 MB, 12,000 about 450 MB. Set what you need, not more.
MAXIMUM_ALLOWED_FTP_CONNECTION = 50

# TCP/IP port settings (default: 21)
FTP_PORT = 21

# Allow only one server instance (true or false)
SINGLE_INSTANCE = true

# Restart the server automatically if it crashes (true or false, default true)
RESPAWN_PROCESS = true

# Run in background daemon mode (true or false)
DAEMON_MODE = true

# Folder where logs are saved (one file a day, uftpLog_YYYY-MM-DD)
LOG_FOLDER = /var/log/

# Days of logs to keep; set to 0 to disable logging (only fatal errors are then
# written, on stderr). Crashes, restarts and the reason of a stop are logged here.
MAXIMUM_LOG_FILES = 30

# Idle timeout in seconds; clients are disconnected after this period of inactivity; set to 0 to disable
# some clients may fail if the timeout is too high https://github.com/kingk85/uFTP/issues/29
IDLE_MAX_TIMEOUT = 330

# Seconds a client may stay connected without completing the login (0 = no limit).
# Counted from the connection (or from the logout caused by USER/AUTH), activity such
# as NOOP does not extend it. Default 60.
LOGIN_TIMEOUT = 60

# Maximum connections per IP address; set to 0 to disable
MAX_CONNECTION_NUMBER_PER_IP = 10

# Maximum number of sessions of one user, from any address (0 = no limit). A user can have a
# limit of its own: MAX_CONNECTION_PER_ACCOUNT_n for USER_n (0 = no limit for that user).
# FileZilla uses up to about 18 connections together for parallel transfers.
MAX_CONNECTION_PER_ACCOUNT = 0

# Maximum number of new connections per minute from one address (0 = no limit). Every connection counts,
# also the ones that do not log in. The ones over the limit are refused with 421. An IPv6 address counts
# as its /64 network. FileZilla opens up to about 18 connections in a few seconds.
MAX_CONNECTION_RATE_PER_IP = 0

# An upload (STOR, APPE) is refused with 452 when the free space of the disk is below this many
# megabytes, and one that is going on is stopped (0 = no check). The server runs as root: without it a
# user can fill the disk of the system. The blocks reserved for root are not counted as free.
# A value of 1024 (1 GB) or more is reasonable.
MIN_FREE_SPACE_MB = 0

# Maximum login attempts per IP (anti bruteforce feature); IP will be blocked for 5 minutes after exceeding this number of failed login attempts; set to 0 to disable
MAX_CONNECTION_TRY_PER_IP = 10

# Server IP address for NAT configurations; use commas instead of periods (e.g., 192,168,1,1); leave commented or blank if not used
#SERVER_IP = 192,168,1,1

# TLS certificate file paths
CERTIFICATE_PATH=/etc/uFTP/cert.pem
PRIVATE_CERTIFICATE_PATH=/etc/uFTP/key.pem

# Enable system authentication based on /etc/passwd and /etc/shadow (true or false)
ENABLE_PAM_AUTH = false

# Force usage of TLS; if enabled, only TLS connections are allowed (true or false)
FORCE_TLS = false

# Random port range for passive FTP connections
RANDOM_PORT_START = 10000
RANDOM_PORT_END   = 50000

# Accept passive data connections only from the address of the control connection
# (RFC 2577). Set to true only if control and data connections of a client leave
# from different addresses (some NAT pools). Default false.
PASV_PROMISCUOUS = false

#######################################################
#                      USER SETTINGS                   #
#######################################################

# Define users with the following parameters:
# USER_<n> = username
# PASSWORD_<n> = password
# HOME_<n> = home directory
# GROUP_NAME_OWNER_<n> = group ownership for new files (optional)
# USER_NAME_OWNER_<n> = user ownership for new files (optional)

# PASSWORD_n is the password in plain text or a PBKDF2-SHA256 hash, so the file does not
# show the passwords. Make the hash with ./uFTP --hash-password (needs OpenSSL) and write
# the line it prints: PASSWORD_0 = $pbkdf2-sha256$100000$<salt>$<hash>
USER_0 = username
PASSWORD_0 = password
HOME_0 = /
GROUP_NAME_OWNER_0 = usergroup
USER_NAME_OWNER_0 = user

USER_1 = apache
PASSWORD_1 = apachePassword
HOME_1 = /var/www/html/
GROUP_NAME_OWNER_1 = www-data
USER_NAME_OWNER_1 = www-data

USER_2 = anotherUsername
PASSWORD_2 = anotherPassowrd
HOME_2 = /

# Blocked users who are not allowed to log in
BLOCK_USER_0 = user1
BLOCK_USER_1 = user2
BLOCK_USER_2 = user3
