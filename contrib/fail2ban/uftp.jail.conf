# Copy to /etc/fail2ban/jail.d/uftp.conf, then restart fail2ban: systemctl restart fail2ban
# (a plain "fail2ban-client reload" after a change of logpath did not make fail2ban follow the new file on a production server)
#
# 5 refusals in 10 minutes = banned for an hour. uFTP also has its own limits (it locks an address
# for 5 minutes after MAX_CONNECTION_TRY_PER_IP failed logins): fail2ban keeps the address out for
# longer, and closes the door at the firewall, where it costs the server nothing.

[uftp]
enabled  = true
filter   = uftp
# uFTP writes a new log file every day and keeps a link to the one of today, uftpLog.current, in LOG_FOLDER of uftpd.cfg
# (the default is /var/log/): fail2ban follows the link when it moves to the new day. Not uftpLog_*: a wildcard is
# expanded only when fail2ban starts, and it would not read the file of a new day.
logpath  = /var/log/uftpLog.current
backend  = auto
# FTP uses the control port (21 or the one of the configuration) and the ports of the data channel
port     = ftp,ftp-data,ftps,ftps-data,21
maxretry = 5
findtime = 10m
bantime  = 1h
