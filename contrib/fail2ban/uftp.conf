# fail2ban filter for uFTP (log files: LOG_FOLDER/uftpLog_YYYY-MM-DD)
#
# Copy to /etc/fail2ban/filter.d/uftp.conf (and contrib/fail2ban/uftp.jail.conf to /etc/fail2ban/jail.d/uftp.conf)
#
# The address is written by uFTP as it sees it: an IPv4 client of a server with IPv6 appears as
# ::ffff:a.b.c.d, which the prefix below removes. The lines that count are the [SECURITY] ones.

[Definition]
# one log line looks like:
# 2026-11-17_21:18:12: [pid 1579555] [SECURITY] [0 ::ffff:203.0.113.5 -] login failed for user anonymous
#
# uFTP groups identical lines for 10 seconds and writes "(N more times in the last 10 s, grouped)": an
# attack that repeats the same user counts once every 10 seconds (the first line and the summaries), one that
# changes the user counts every attempt. Both are enough to reach maxretry.
datepattern = ^%%Y-%%m-%%d_%%H:%%M:%%S:

_ip = (?:::ffff:)?<ADDR>

# What counts as an attack: a failed login (a blocked user also gets this line), an address that keeps trying
# while it is locked out, and a flood of connections.
# What does NOT count, on purpose: "login refused: user X has too many connections" and "too many connection from
# ip address": they can hit a legitimate user (an office behind one address, a client that opens many sessions),
# and a ban would be the damage.
# Every line ends with " - File ... at line N - fun ...()": the expressions do not use $.
failregex = ^\s*\[pid \d+\] \[SECURITY\] \[\d+ %(_ip)s [^\]]*\] login failed for user\b
            ^\s*\[pid \d+\] \[SECURITY\] Ip %(_ip)s blocked due too many password errors\.
            ^\s*\[pid \d+\] \[SECURITY\] Connection refused: %(_ip)s opened more than \d+ connections in the last minute

ignoreregex =
